<script type="module">
    import { get_website, get_favicon } from "./scripts/GetUrl.js";
    import { redirect } from "./scripts/Redirect.js";

    if (window.location.hash.endsWith("[][]")) {
        const website = get_website();
        const favicon = get_favicon();

        console.log("Hash:", window.location.hash);
        console.log("Website:", website);
        console.log("Favicon:", favicon);

        if (favicon) {
            const link = document.createElement("link");

            link.rel = "icon";
            link.href = favicon;

            document.head.appendChild(link);
        }

        if (website) {
            redirect(website);
        } else {
            alert("Nenhum website encontrado.");
        }
    } else {
        window.location.href = "criar.html";
    }
</script>
