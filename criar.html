<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/Classic.css">
    <link rel="stylesheet" href="styles/Oficina.css">

    <title>Oficina</title>
</head>

<body>
    <main class="center">
        <section class="card">
            <div class="header">
                <h1>Criação de Redirect</h1>
                <p>Configure o endereço para onde seu site será redirecionado.</p>
            </div>

            <div class="form">
                <label for="host">Protocolo</label>

                <select id="host">
                    <option value="https://">HTTPS</option>
                    <option value="http://">HTTP</option>
                </select>

                <label for="site">Nome do site</label>
                <input id="site" type="text" placeholder="sitelegal" autocomplete="on">

                <label for="ext">Extensão do site</label>
                <input id="ext" type="text" placeholder=".com" autocomplete="on" value=".com">

                <label for="tx">Injetar codigo javascript</label>
                <input id="tx" type="text" placeholder="Codigo" autocomplete="on">

                <div id="manual-obfuscation">
                    <label for="ofuscation_pre">Ofuscação prefixal</label>
                    <input id="ofuscation_pre" type="text" autocomplete="on"
                        value="o_O=aZoKgD_FKqnFSOeTgS@eQ=K+K__+Zt0FXU1EUC%?FV3yshE=Dlfp4NyQoTdHhZtAC128B3N9tXRO?0C6">

                    <label for="ofuscation_suf">Ofuscação sufixal</label>
                    <input id="ofuscation_suf" type="text" autocomplete="on" value="zonFrEzc5W6NoVBbY1VD">
                </div>
                <div class="random-option" id="switch_peso">
                    <span>Ofuscação aleatória</span>

                    <label class="switch">
                        <input id="randomize" type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="show-website" id="switch_peso">
                    <span>Aparecer site no index</span>

                    <label class="switch">
                        <input id="caguetar" type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="tx-itsraw" id="switch_peso">
                    <span>Execução javascript é uma raw</span>

                    <label class="switch">
                        <input id="itsraw" type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="wait_tx" id="switch_peso">
                    <span>Esperar injeção terminar para redirecionar</span>

                    <label class="switch">
                        <input id="wait_tx" type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>

                <button type="button" id="Criador">
                    Criar Redirect
                </button>

                <div class="result">
                    <label for="resultado">Link gerado</label>

                    <input id="resultado" type="text" placeholder="O link gerado aparecerá aqui" readonly
                        autocomplete="off">

                    <button type="button" id="Copiar">
                        Copiar
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { create } from "./scripts/CreateWeb.js";

        const btn = document.getElementById("Criador");
        const copiar = document.getElementById("Copiar");
        const randomize = document.getElementById("randomize");
        const x9 = document.getElementById("caguetar");
        const tx = document.getElementById("tx");
        const itsraw = document.getElementById("itsraw");
        const waitTx = document.getElementById("wait_tx");
        const manualObfuscation = document.getElementById("manual-obfuscation");

        function randomString(length) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ" + "abcdefghijklmnopqrstuvwxyz" + "0123456789" + "@#$%&*+=?!_-";

            const array = new Uint32Array(length);
            crypto.getRandomValues(array);

            let result = "";

            for (let i = 0; i < length; i++) {
                result += chars[array[i] % chars.length];
            }

            return result;
        }

        function updateObfuscationVisibility() {
            manualObfuscation.style.display = randomize.checked ? "none" : "flex";
        }

        randomize.addEventListener("change", updateObfuscationVisibility);

        updateObfuscationVisibility();

        btn.addEventListener("click", () => {
            const host = document.getElementById("host");
            const site = document.getElementById("site");
            const ext = document.getElementById("ext");

            const pre = document.getElementById("ofuscation_pre");
            const suf = document.getElementById("ofuscation_suf");

            if (randomize.checked) {
                pre.value = randomString(
                    Math.floor(Math.random() * (1236 - 500 + 1)) + 500
                );

                suf.value = randomString(
                    Math.floor(Math.random() * (1236 - 500 + 1)) + 500
                );
            }

            const [success, link] = create(
                host.value,
                site.value,
                pre.value,
                suf.value,
                ext.value,
                x9.checked,
                tx.value,
                itsraw.checked,
                waitTx.checked
            );

            if (success) {
                const resultado = document.getElementById("resultado");
                resultado.value = link;
            } else {
                alert(link);
            }
        });
        copiar.addEventListener("click", async () => {
            const resultado = document.getElementById("resultado");

            if (!resultado.value) {
                return;
            }

            try {
                await navigator.clipboard.writeText(resultado.value);

                copiar.textContent = "Copiado!";

                setTimeout(() => {
                    copiar.textContent = "Copiar";
                }, 1500);
            } catch (err) {
                resultado.select();
                document.execCommand("copy");

                copiar.textContent = "Copiado!";

                setTimeout(() => {
                    copiar.textContent = "Copiar";
                }, 1500);
            }
        });
    </script>
</body>

</html>
